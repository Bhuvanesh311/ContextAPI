
services:
  postgres:
    image: postgres:17
    container_name: contextapi-postgres

    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - contextapi-network

volumes:
  postgres-data:


networks:
  contextapi-network:
    external: true