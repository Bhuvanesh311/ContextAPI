# clamd settings for ContextAPI. Mounted over the image's /etc/clamav/clamd.conf.
# The image default keeps only logging and sockets; the size limits below are
# what lets uploads up to the 500 MB per-file limit be scanned at all
# (the default INSTREAM limit is ~100 MB and larger files failed with
# "Failed to scan file").
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Upload limit is 500 MB per file (app/knowledge/uploads/constants.py).
StreamMaxLength 520M
MaxFileSize 520M
# Archives expand: allow the scan to look at more data than the file size.
MaxScanSize 2000M
# 10 minutes for a very large file; the worker waits on this.
MaxScanTime 600000
ReadTimeout 600
CommandReadTimeout 600
