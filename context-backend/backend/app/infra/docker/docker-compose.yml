
# File names must match exactly: Linux paths are case-sensitive.
# Neo4j (compose/docker-compose.neo4j.yml) is left out until relationship
# search is implemented; nothing in the code uses it yet.
include:
  - ./compose/docker-compose.postgres.yml
  - ./compose/docker-compose.redis.yml
  - ./compose/docker-compose.rabbitmq.yml
  - ./compose/docker-compose.minIO.yml
  - ./compose/docker-compose.clamAV.yml
  - ./compose/docker-compose.chromadb.yml


networks:
  contextapi-network:
    name: contextapi-network
