# Production frontend on http://localhost:8080 (set WEB_PORT to change it).
# Needs the backend stack running: it joins the same Docker network and
# reaches the API container by name.
#
#   docker compose up -d --build
services:
  web:
    build: .
    image: contextapi/web:latest
    container_name: contextapi-web
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      BACKEND_URL: http://contextapi-app-api-1:8000
    networks:
      - contextapi-network
    restart: unless-stopped

networks:
  contextapi-network:
    external: true
